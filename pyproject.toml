[project]
name = "salon-bot"
version = "0.1.0"
description = "Telegram bot for salon/barbershop appointment booking"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "SQLAlchemy>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "twilio>=9.0",
    "structlog>=24.1",
    "greenlet",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "aiosqlite>=0.20", "fakeredis>=2.20"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
