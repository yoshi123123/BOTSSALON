services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # The bot applies migrations and seeds demo data itself on start-up.
  bot:
    build: .
    command: python -m app.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://salon:salon@db:5432/salon
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
